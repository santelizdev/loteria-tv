services:
  postgres:
    image: postgres:16
    container_name: loteria_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loteria
      POSTGRES_USER: loteria
      POSTGRES_PASSWORD: loteria
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loteria -d loteria"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: loteria_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: loteria_app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      RUN_MIGRATIONS: "1"
      COLLECTSTATIC: "1"
      WARM_SCRAPERS_ON_BOOT: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: loteria_worker
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media
    command: ["celery", "-A", "config", "worker", "-l", "info"]

  beat:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: loteria_beat
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  gateway:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: loteria_gateway
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      PWA_APP_VERSION: "${PWA_APP_VERSION:-}"
    volumes:
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro

volumes:
  pgdata:
  redisdata:
  staticfiles:
  media:
