x-app-common: &app-common
  build:
    context: .
    dockerfile: docker/app/Dockerfile
  restart: unless-stopped
  env_file:
    - .env.prod
  network_mode: host
  volumes:
    - ./staticfiles:/app/staticfiles
    - ./media:/app/media

services:
  app:
    <<: *app-common
    container_name: loteriatv_app_prod
    environment:
      RUN_MIGRATIONS: "1"
      COLLECTSTATIC: "1"
      WARM_SCRAPERS_ON_BOOT: "${WARM_SCRAPERS_ON_BOOT:-1}"
    command: ["daphne", "-b", "127.0.0.1", "-p", "18081", "config.asgi:application"]

  worker:
    <<: *app-common
    container_name: loteriatv_worker_prod
    command: ["celery", "-A", "config", "worker", "-l", "info"]

  beat:
    <<: *app-common
    container_name: loteriatv_beat_prod
    command: ["celery", "-A", "config", "beat", "-l", "info"]

  gateway:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: loteriatv_gateway_prod
    restart: unless-stopped
    network_mode: host
    depends_on:
      - app
    environment:
      PWA_APP_VERSION: "${PWA_APP_VERSION:-}"
    volumes:
      - ./staticfiles:/var/www/static:ro
      - ./media:/var/www/media:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
